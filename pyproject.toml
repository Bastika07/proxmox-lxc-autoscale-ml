# The project is deployed as loose scripts rather than installed as a package,
# so this file only carries tool configuration.

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["docs/node_modules", "docs/.vitepress"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "DTZ",  # naive datetimes: the monitor writes aware UTC, naive "now" crashed the model
    "TID",  # banned APIs, see flake8-tidy-imports below
]
ignore = [
    "E501",    # line length is handled by the formatter, not enforced
    "S101",    # assert is expected in the test suite
    "UP032",   # str.format is used deliberately for the HTML template
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# DTZ does not see pandas. A naive pd.Timestamp.now() against the monitor's
# aware UTC timestamps raised "Cannot subtract tz-naive and tz-aware" on every
# cycle on a real host.
"pandas.Timestamp.now".msg = "Use pd.Timestamp(datetime.now(UTC)); naive local time does not compare with the monitor's UTC timestamps."
"pandas.Timestamp.utcnow".msg = "Use pd.Timestamp(datetime.now(UTC))."

[tool.ruff.lint.per-file-ignores]
# Proxmox management inherently shells out to pct/pvesh/pvecm.
"lxc_autoscale_ml/api/lxc_management.py" = ["S603", "S607"]
"lxc_autoscale_ml/api/resource_checking.py" = ["S603", "S607"]
"lxc_autoscale_ml/api/health_check.py" = ["S603", "S607"]
"lxc_autoscale_ml/monitor/lxc_monitor.py" = ["S603", "S607"]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
